name: Nuven Bot checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nuven-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile rendering
        run: |
          sudo mkdir -p /workspace/screenshots
          sudo chown "$USER" /workspace/screenshots
          npm run dev > /tmp/nuven-dev.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs http://127.0.0.1:8080/ "/workspace/screenshots/dev.png"
          npm run preview > /tmp/nuven-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8081/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/browser-smoke.mjs http://127.0.0.1:8081/ "/workspace/screenshots/built.png" --baseline "/workspace/screenshots/dev.json"
          node scripts/quadro-browser-check.mjs
          node scripts/security-browser-check.mjs
          node scripts/landing-browser-check.mjs
          node scripts/cloud-browser-check.mjs
          node scripts/public-review-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuven-browser-checks
          path: /workspace/screenshots/
          retention-days: 7
