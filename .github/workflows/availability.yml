name: Nuvem Bot availability
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions: {}
concurrency:
  group: nuvem-availability
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public pages without login or paid API calls
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures, sys, urllib.request
          origin = 'https://www.nuvembot.net'
          def check(path):
              try:
                  req = urllib.request.Request(origin + path, headers={'User-Agent': 'NuvenBot-Availability/1.0'})
                  with urllib.request.urlopen(req, timeout=25) as response:
                      content = response.read(200000).decode('utf-8', errors='replace')
                      ok = response.status == 200 and 'text/html' in response.headers.get('Content-Type', '') and 'nuven bot' in content.lower()
                      return path, ok, str(response.status)
              except Exception as error:
                  return path, False, type(error).__name__
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              results = list(pool.map(check, ['/', '/conta', '/documentos', '/nuvem']))
          for path, ok, detail in results:
              print(('OK' if ok else 'FAIL') + ' ' + path + ' ' + detail)
          sys.exit(0 if all(ok for _, ok, _ in results) else 1)
          PY
